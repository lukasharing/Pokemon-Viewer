<!-- MAP EDITOR -->
<!-- The shared context-menu controller owns this host's complete contents. -->
<div id="map_contextmenu" class="hide"></div>

<section class="editor_area hide" id="map_editor">
  <div id="map_visualization">
    <div id="block_selection" class="window editor-support" data-window-title="Blocks" data-window-icon="▦" style="left: 100px; width: 200px;">
      <div class="window_menu">
        Blocks
        <div class="window_expand"></div>
      </div>
      <div class="window_content hide">
        <div id="window_blocks_padding">
          <div class="ui-tabs block_tabs" role="tablist" data-map-families="gba">
            <button type="button" role="tab" data-tileset="0" class="active">Primary</button>
            <button type="button" role="tab" data-tileset="1">Secondary</button>
          </div>
          <div id="selected_block"></div>
          <canvas id="blocks_map">Shut.</canvas>
        </div>
      </div>
    </div>

    <div class="window editor-toolbox" data-window-title="Tools" data-window-icon="✦" style="left: 10px; width: 210px;">
      <div class="window_menu"><div class="window_expand"></div> </div>
      <div class="window_content hide">
        <div class="map-tools__group map-tools__group--edit">
          <div class="map_tool" data-type="0-1" data-current="0"></div>
          <div class="map_tool" data-type="3-4" data-current="3"></div>
          <div class="map_tool" data-type="5-6" data-current="5"></div>
          <div class="map_tool" data-type="13" data-current="13"></div>
        </div>
        <div class="map-tools__group map-tools__group--view">
          <div class="map_tool" data-type="9-10-11-12" data-current="9"></div>
          <div class="map_tool" data-type="14-15" data-current="14"></div>
        </div>
      </div>
    </div>
    <div class="window editor-toolbox" data-window-title="Navigation" data-window-icon="⌘" style="left: 60px; width: 120px;">
      <div class="window_menu"><div class="window_expand"></div></div>
      <div class="window_content hide"><div class="map-navigation-controls">
        <div class="map_tool selected" data-type="2" data-current="2"></div>
        <div class="map_tool" data-type="7" data-current="7"></div>
        <div class="map_tool" data-type="8" data-current="8"></div>
      </div></div>
    </div>
    <canvas id="canvas_map" class="editor-view">Shut.</canvas>
  </div>
  <div id="map_banks"></div>
</section>
