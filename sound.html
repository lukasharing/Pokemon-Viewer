<section class="editor_area editor-document editor-shell hide" id="sound_editor" data-editor-workspace="sound">
  <aside class="sound-sidebar editor-library editor-shell__library editor-context-header" aria-label="Sound library">
    <div class="sound-sidebar__content editor-library__content editor-shell__library-content editor-context-header__content">
      <label>Group <select id="sound_group" aria-label="Sound document group"></select></label>
      <label>Find sound <input id="sound_filter" type="search" placeholder="Song, cry or effect…" aria-label="Find sound"></label>
      <label>Sound <select id="sound_cue" aria-label="Sound document"></select></label>
    </div>
  </aside>
  <main class="sound-stage editor-document__stage editor-shell__stage editor-shell__stage--document">
    <header class="sound-document editor-document__header editor-shell__header">
      <div><span id="sound_kind" class="sound-kind">Sound</span><h1 id="sound_title">Sound</h1></div>
      <div class="sound-document__state"><span id="sound_playback" class="sound-playback"><i class="fa-solid fa-circle" aria-hidden="true"></i><span>Unavailable</span></span><p id="sound_status">Load a ROM.</p></div>
    </header>
    <section class="sound-primary editor-primary-visual editor-view editor-shell__main" data-editor-region="main" data-ui-window="Audio" data-ui-window-icon="fa-wave-square" data-ui-window-minimizable="false">
      <header data-ui-window-header><strong id="sound_visual_title">Waveform</strong><span id="sound_accuracy" class="sound-accuracy"></span></header>
      <div class="sound-primary__content" data-ui-window-content>
        <div class="sound-transport editor-actions" aria-label="Audio playback and timeline">
          <button id="sound_play" class="ui-button ui-button--primary" type="button"><i class="fa-solid fa-play" aria-hidden="true"></i><span>Play</span></button>
          <button id="sound_stop" class="ui-button ui-button--icon" type="button" title="Stop" aria-label="Stop"><i class="fa-solid fa-stop" aria-hidden="true"></i></button>
          <input id="sound_scrubber" type="range" min="0" max="1" value="0" step="1" aria-label="Audio position" disabled>
          <output id="sound_time">0:00</output>
          <span class="sound-transport__separator" aria-hidden="true"></span>
          <button id="sound_zoom_out" class="ui-button ui-button--icon" type="button" title="Zoom out" aria-label="Zoom out"><i class="fa-solid fa-magnifying-glass-minus" aria-hidden="true"></i></button>
          <button id="sound_zoom_fit" class="ui-button ui-button--icon" type="button" title="Fit timeline" aria-label="Fit timeline"><i class="fa-solid fa-arrows-left-right-to-line" aria-hidden="true"></i></button>
          <button id="sound_zoom_in" class="ui-button ui-button--icon" type="button" title="Zoom in" aria-label="Zoom in"><i class="fa-solid fa-magnifying-glass-plus" aria-hidden="true"></i></button>
        </div>
        <div class="sound-arrangement" aria-label="Native channel arrangement">
          <div id="sound_timeline_scroller" class="sound-timeline-scroller">
            <canvas id="sound_timeline" width="960" height="320" aria-label="Audio waveform or native channel arrangement"></canvas>
            <div id="sound_empty" class="sound-empty hide"><i class="fa-solid fa-wave-square" aria-hidden="true"></i><strong>No decoded audio</strong><span>This resource has no verified waveform or channel program yet.</span></div>
          </div>
          <ul id="sound_tracks" class="sound-list sound-track-list"></ul>
        </div>
      </div>
    </section>
    <div class="sound-secondary editor-panel-row editor-shell__panels" data-editor-region="panels">
      <section class="sound-inspector editor-attributes" data-ui-window="Parameters" data-ui-window-icon="fa-sliders" data-ui-window-minimizable="false">
        <header data-ui-window-header><strong>Parameters</strong></header>
        <div data-ui-window-content>
          <form id="sound_edit_form" class="sound-edit-form hide"><div id="sound_edit_fields" class="sound-edit-fields"></div></form>
          <dl class="ui-properties sound-properties" id="sound_properties"></dl>
        </div>
        <footer id="sound_edit_actions" class="editor-actions hide" data-ui-window-footer><button id="sound_reset" class="ui-button" type="button"><i class="fa-solid fa-arrow-rotate-left" aria-hidden="true"></i><span>Reset</span></button><button id="sound_edit" class="ui-button ui-button--primary" type="button"><i class="fa-solid fa-check" aria-hidden="true"></i><span>Apply</span></button></footer>
      </section>
      <section class="sound-references editor-support" data-ui-window="Used by" data-ui-window-icon="fa-link"><header data-ui-window-header><strong>Used by</strong></header><ul id="sound_references" class="sound-list" data-ui-window-content></ul></section>
      <section class="sound-commands editor-support" data-ui-window="Engine data" data-ui-window-icon="fa-code" data-ui-window-minimizable="false" data-complexity="advanced"><header data-ui-window-header><strong>Engine data</strong></header><div class="sound-command-scroll" data-ui-window-content><table><thead><tr><th>Offset</th><th>Command</th><th>Arguments</th><th>Tick</th></tr></thead><tbody id="sound_commands"></tbody></table></div></section>
    </div>
  </main>
</section>
