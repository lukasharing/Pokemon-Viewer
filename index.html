	</head>
	<body data-rom-loaded="false">
    <!-- LightBox -->
    <div class="lightbox middle" id="selectLightboxRom">
      <div id="file_selection">
        <div id="upload_game">
          <div id="upload_drag">
            <h4>Drag &amp; Drop</h4>
            <h5>A Pokémon GB, GBC, or GBA game</h5>
            <h6>The game, language and revision are detected automatically.</h6>
            <input type="file" id="upload_input" name="upload" accept=".gba,.gbc,.gb" class="hide" />
          </div>
          <button id="upload_mini" type="button" class="blue_background">Browse for a ROM</button>
        </div>
        <div id="loader_file_container" data-width="10" class="loader hide"></div>
      </div>
    </div>
    <!-- Left Side (Menu) -->
    <aside>
  		<header>
        <!-- Changing game button -->
			<button id="new_upload" class="file_button_in" type="button">Open ROM</button>

        <section id="bookmarks" class="bookmarks" aria-label="Bookmarks">
          <header><strong>Bookmarks</strong><button id="bookmark_add" type="button" title="Remember the current place">+</button></header>
          <div class="bookmark-list"></div>
        </section>

        <!-- Menu loaded from html files -->
  			<nav id="navigation"></nav>
      </header>
      <footer>
        <button id="emulator_dock_toggle" class="settings-dock" type="button" disabled aria-pressed="false"><i class="fa-solid fa-gamepad" aria-hidden="true"></i> Emulator</button>
        <button id="settings_dock" class="settings-dock" type="button"><i class="fa-solid fa-gear" aria-hidden="true"></i> Settings</button>
        <p class="app-credit">&copy; 2026 · Made with love by Lukas Häring</p>
      </footer>
    </aside>
    <!-- Right Side (Content) -->
		<main id="main_result">
		</main>

		<!-- Notification area -->
		<div id="notification-area" aria-live="polite" aria-relevant="additions"></div>
		<!-- Pre-rendered stuff -->
		<div class="hide" id="hidde_stuff">
			<img src="css/images/map_editor/border_height.png" id="height_image" />
		</div>
    <div class="hide" id="clipboard"></div>
	</body>
